# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: check merge conflict markers
      glob: "*"
      exclude:
        - "*.md"
        - "*.mdx"
      run: "! git grep -nEI '<{7} |>{7} |^={7}$' -- {staged_files} || (echo 'Error: merge conflict markers found in staged files'; exit 1)"
    - name: lint and format
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: pnpm biome check --write --unsafe --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}
